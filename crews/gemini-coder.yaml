# Mixed crew (NGH-012): Claude Foreman, Gemini Coder in Antigravity's agy. `nightshift start --crew gemini-coder`.
# agy cannot use ListAgents/SendMessage; the renderer gives each member the messaging lines for its tool
# (one brief per role, NGH-063). A role's tool: is claude (default) or agy; its model:
# defaults to the crew model.
name: gemini-coder
permission_mode: auto        # Claude --permission-mode for Claude panes (agy: auto means --dangerously-skip-permissions, see permission_flags)
model: claude-opus-5-5
layout: 2x4                  # the container: 2 rows x 4 columns (8 slots), crew in the first slots, empty cmd shells after (spawn fills them)
contract: result.json        # the file Foreman writes in the shift folder when the shift ends
roles:
  - role: Foreman
    brief: foreman.md
    colour: red
    count: 1
    human_contact: true      # receives the task; the only one who talks to the human
  - role: Coder
    brief: coder.md
    tool: agy
    model: gemini-3.8-flash-high
    colour: green
    count: 1
