# Mixed crew (NGH-012): Claude Foreman, Gemini Coder in Antigravity's agy. `nightshift start --crew gemini-coder`.
# agy cannot use ListAgents/SendMessage, so Foreman drives the Coder pane with agents-cli send/wait/tail
# (briefs foreman-agy-coder.md / coder-agy.md). A role's tool: is claude (default) or agy; its model:
# defaults to the crew model.
name: gemini-coder
permission_mode: auto        # Claude --permission-mode for Claude panes (agy runs --mode auto)
model: claude-opus-5-5
layout: split                # one Terminal window; panes left-to-right, a second row above 4
contract: result.json        # the file Foreman writes in the shift folder when the shift ends
roles:
  - role: Foreman
    brief: foreman-agy-coder.md
    colour: red
    count: 1
    human_contact: true      # receives the task; the only one who talks to the human
  - role: Coder
    brief: coder-agy.md
    tool: agy
    model: gemini-3.8-flash-high
    colour: green
    count: 1
