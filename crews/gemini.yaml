# All-Gemini crew in Antigravity's agy (owner, 16 Oct): Gemini 4 Argon on high for Foreman and Advisor,
# Gemini 3.8 Flash on high for the working roles. agy's model name carries the effort (argon-high, flash-high);
# list them with `agy models`. 2x4 container: slots 1..5 crew, 6..8 empty for `nightshift spawn`.
name: gemini
model: gemini-4-argon-high
layout: 2x4
ops_width: 2                 # the Ops pane (bottom right) spans two cells
contract: result.json
roles:
  - {role: Foreman, brief: foreman.md, human_contact: true, colour: red, tool: agy, model: gemini-4-argon-high, permissions: skip}
  - {role: Advisor, brief: advisor.md, colour: purple, tool: agy, model: gemini-4-argon-high, permissions: skip}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, tool: agy, model: gemini-3.8-flash-high, permissions: skip}
  - {role: Coder, brief: coder.md, colour: green, tool: agy, model: gemini-3.8-flash-high, permissions: skip}
  - {role: Tester, brief: tester.md, colour: blue, tool: agy, model: gemini-3.8-flash-high, permissions: skip}
