# Work crew: four members, no Apprentice, because five sessions use too much memory on a
# machine with limited memory. Foreman on Claude Opus 5.5, Coder and Tester on GitHub Copilot with Gemini 3.8 Flash (high),
# Advisor on Claude Opus 5.5 started only when the Foreman consults it (NGH-050), so three sessions run normally.
# max_credits is the shift's Copilot budget, split over the Coder and Tester panes; 30 per pane is Copilot's minimum.
name: work
permission_mode: auto
model: claude-opus-5-5
layout: 2x4
ops_width: 2                 # the Ops pane (bottom right) spans two cells
contract: result.json
max_credits: 60
roles:
  - {role: Foreman, brief: foreman.md, human_contact: true, colour: red, tool: claude, model: claude-opus-5-5}
  - {role: Advisor, brief: advisor.md, colour: purple, tool: claude, model: claude-opus-5-5}
  - {role: Coder, brief: coder-cli.md, colour: green, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
  - {role: Tester, brief: tester-cli.md, colour: blue, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
