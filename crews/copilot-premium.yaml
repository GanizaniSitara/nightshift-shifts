# Crew on Copilot with premium models: Foreman, Advisor, Coder and Tester on the
# strongest model the Copilot subscription offers (Opus, Sol or Argon); Gemini 3.8 Flash as the
# Apprentice, the primary coding agent, with the Coder as its senior buddy (NGH-038).
# MODEL NAMES: some Copilot subscriptions offer only grok-4.7 and gemini-3.8-flash, so the premium
# names below are placeholders until checked against the model catalog (copilot --model NAME -p ok).
name: copilot-premium
model: PREMIUM-MODEL-AT-WORK
layout: 2x4
contract: result.json
roles:
  - {role: Foreman, brief: foreman.md, human_contact: true, colour: red, tool: copilot, model: PREMIUM-MODEL-AT-WORK, reasoning: high, permissions: skip}
  - {role: Advisor, brief: advisor.md, colour: purple, tool: copilot, model: PREMIUM-MODEL-AT-WORK, reasoning: high, permissions: skip}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
  - {role: Coder, brief: coder.md, colour: green, tool: copilot, model: PREMIUM-MODEL-AT-WORK, reasoning: high, permissions: skip}
  - {role: Tester, brief: tester.md, colour: blue, tool: copilot, model: PREMIUM-MODEL-AT-WORK, reasoning: high, permissions: skip}
