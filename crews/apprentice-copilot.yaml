# Default Claude crew plus an Apprentice on GitHub Copilot CLI (Gemini 3.8 Flash) in slot 5 of the 2x4 container;
# slots 6..8 empty for `nightshift spawn`. Also the manifest `spawn SHIFT --role Apprentice --crew apprentice-copilot`
# reads to put a Copilot Apprentice into a live shift.
name: apprentice-copilot
permission_mode: auto        # Claude --permission-mode for the Claude panes
model: claude-opus-5-5
layout: 2x4
contract: result.json
roles:
  - {role: Foreman, brief: foreman.md, colour: red, count: 1, human_contact: true}
  - {role: Advisor, brief: advisor.md, colour: purple, count: 1, model: claude-fable-5-1}
  - {role: Coder, brief: coder.md, colour: green, count: 1}
  - {role: Tester, brief: tester.md, colour: blue, count: 1}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, count: 1, tool: copilot, model: gemini-3.8-flash-high, permissions: skip}
