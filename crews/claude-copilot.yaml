# Claude Foreman, Advisor and Coder (Opus 5.5) with Apprentice and Tester on GitHub Copilot CLI (Gemini 3.8 Flash,
# high reasoning, long-context tier) in the 2x4 container. Slots 1..5 crew, 6..8 empty for `nightshift spawn`.
# Owner decision 16 Oct 12:52: the Apprentice is the primary coder on Flash; the Coder is the senior buddy, paid
# only on uplift. Apprentice is listed before Coder: Apprentice-first routing (NGH-038) applies.
# Reasoning follows the crew convention: Opus roles on their default effort (no reasoning:), Gemini at high.
# max_credits is the shift's Copilot AI credit budget (owner, 16 Oct): split evenly over the Copilot panes, here
# 60 over Apprentice and Tester, 30 each; the owner changes this one line. Each pane's share must be at least 30
# (Copilot's minimum) and reaches Copilot as --max-ai-credits, a soft cap per pane; credits are read from the pane
# with /usage.
name: claude-copilot
permission_mode: auto        # Claude --permission-mode for the Claude panes
model: claude-opus-5-5
layout: 2x4
contract: result.json
max_credits: 60              # shift budget: 2 Copilot panes x 30
roles:
  - {role: Foreman, brief: foreman.md, human_contact: true, colour: red, tool: claude, model: claude-opus-5-5}
  - {role: Advisor, brief: advisor.md, colour: purple, tool: claude, model: claude-opus-5-5}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
  - {role: Coder, brief: coder.md, colour: green, tool: claude, model: claude-opus-5-5}
  - {role: Tester, brief: tester-cli.md, colour: blue, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
