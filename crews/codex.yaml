# Five-role Codex crew in the 2x4 container (owner, 17 Oct): GPT-6.1 Sol on high for every working role, the
# Advisor on GPT-6 Astra (the frontier model; no newer Astra exists as of Codex 0.163), dormant until consulted.
# The Apprentice runs on the second Codex account to spread the load.
name: codex
model: gpt-6.1-sol
layout: 2x4
ops_width: 2                 # the Ops pane (bottom right) spans two cells
roles:
  - {role: Foreman, brief: foreman.md, human_contact: true, colour: red, tool: codex, model: gpt-6.1-sol, reasoning: high}
  - {role: Advisor, brief: advisor.md, colour: purple, tool: codex, model: gpt-6-astra, reasoning: high}
  - {role: Coder, brief: coder.md, colour: green, tool: codex, model: gpt-6.1-sol, reasoning: high}
  - {role: Tester, brief: tester.md, colour: blue, tool: codex, model: gpt-6.1-sol, reasoning: high}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, tool: codex, model: gpt-6.1-sol, reasoning: high, account: 2}
