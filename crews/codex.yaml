# Five-role Codex crew in the 2x4 container (slots 1..5 crew, slots 6..8 empty for `nightshift spawn`):
# Foreman (Sol 6.1), Advisor (Astra 6, dormant), Coder (Astra 6), Tester (Astra 6), Apprentice (Luna 5.6); every model on high reasoning (owner, 16 Oct).
# Owner, 16 Oct afternoon: Codex usage is high, so only the Foreman stays on Sol; the working roles drop a tier.
name: codex
model: gpt-6.1-sol
layout: 2x4
roles:
  - {role: Foreman, brief: foreman-cli.md, human_contact: true, colour: red, tool: codex, model: gpt-6.1-sol, reasoning: high}
  - {role: Advisor, brief: advisor-cli.md, colour: purple, tool: codex, model: gpt-6-astra, reasoning: high}
  - {role: Coder, brief: coder-cli.md, colour: green, tool: codex, model: gpt-6-astra, reasoning: high}
  - {role: Tester, brief: tester-cli.md, colour: blue, tool: codex, model: gpt-6-astra, reasoning: high}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, tool: codex, model: gpt-5.6-luna, reasoning: high}
