# Nightshift crew manifest: `nightshift start` uses this one; `nightshift start --crew NAME`
# reads crews/NAME.yaml instead. Briefs are files in briefs/ (common.md
# always comes first). Exactly one role has human_contact: true and count 1; 2 to 8 panes in all.
# The default crew is Foreman, Advisor, Coder, Tester and Apprentice in slots 1..5 of the 2x4 container,
# leaving slots 6..8 as empty cmd shells for `spawn`. To try the Apprentice on another CLI inside a live
# default shift, Foreman runs `spawn SHIFT --role Apprentice --crew apprentice-codex` (or apprentice-gemini,
# apprentice-copilot). OpenCode and Qwen have no apprentice manifest yet: they are not in TOOLS, so
# load_crew would refuse one.
# layout: split instead sizes the tab to the crew (2-8 panes, a second row above 4).
name: default
permission_mode: auto        # Claude --permission-mode for every pane
model: claude-opus-5-5
layout: 2x4                  # the container: 2 rows x 4 columns (8 slots), crew in the first slots, empty cmd shells after
contract: result.json        # the file Foreman writes in the shift folder when the shift ends
roles:
  - role: Foreman
    brief: foreman.md
    colour: red
    count: 1
    human_contact: true      # receives the task; the only one who talks to the human
  # Dormant frontier-model consultant (NGH-027): no READY, woken only by Foreman, answers only Foreman.
  # Switching it to Astra (Codex) or Mistral Large 4 (OpenCode) later is this role's model:/tool: lines
  # plus the agents-cli transport the Gemini Coder uses (crews/gemini-coder.yaml).
  - role: Advisor
    brief: advisor.md
    colour: purple
    count: 1
    model: claude-fable-5-1  # role-level; the crew model above stays Opus
  - role: Coder
    brief: coder.md
    colour: green
    count: 1
  - role: Tester
    brief: tester.md
    colour: blue
    count: 1
  # Second, cheap coder (NGH-029): bounded, well-specified jobs only; Foreman drives it with agents-cli.
  - role: Apprentice
    brief: apprentice.md
    colour: yellow
    count: 1
    tool: agy
    model: gemini-3.8-flash-high
    permissions: skip        # owner decision 16 Oct: agy has no classifier mode; prompts would stall the crew
