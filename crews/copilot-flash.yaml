# All-Copilot crew with one Claude Advisor: Gemini 3.8 Flash on GitHub Copilot CLI for every role,
# Foreman included; the Advisor is Claude Opus 5.5 on its default effort and starts only when the Foreman consults it
# (NGH-050). Where Copilot does not offer Opus, the Advisor runs in Claude Code; otherwise it can move to Copilot.
# max_credits is the shift's Copilot budget, split evenly over the four Copilot panes (30 each, Copilot's minimum).
name: copilot-flash
permission_mode: auto
model: gemini-3.8-flash
layout: 2x4
ops_width: 2                 # the Ops pane (bottom right) spans two cells
contract: result.json
max_credits: 120             # shift budget: 4 Copilot panes x 30
roles:
  - {role: Foreman, brief: foreman.md, human_contact: true, colour: red, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
  - {role: Advisor, brief: advisor.md, colour: purple, tool: claude, model: claude-opus-5-5}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
  - {role: Coder, brief: coder.md, colour: green, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
  - {role: Tester, brief: tester.md, colour: blue, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
