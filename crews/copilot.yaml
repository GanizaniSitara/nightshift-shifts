# The shippable work crew (owner, 16 Oct 2026): every role on GitHub Copilot CLI, the one subscription
# available at work. Grok 4.7 at max reasoning leads and checks; Gemini 3.8 Flash at high reasoning with
# the long-context (1M) tier writes the code. Slots 1..5 crew, 6..8 empty for `nightshift spawn`.
# Model names verified against the live Copilot catalog on 16 Oct 2026 (grok-4.7, gemini-3.8-flash).
# reasoning: and context: reach Copilot as --reasoning-effort and --context (NGH-037).
name: copilot
model: grok-4.7
layout: 2x4
contract: result.json
roles:
  - {role: Foreman, brief: foreman-cli.md, human_contact: true, colour: red, tool: copilot, model: grok-4.7, reasoning: max, permissions: skip}
  - {role: Advisor, brief: advisor-cli.md, colour: purple, tool: copilot, model: grok-4.7, reasoning: max, permissions: skip}
  - {role: Coder, brief: coder-cli.md, colour: green, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
  - {role: Tester, brief: tester-cli.md, colour: blue, tool: copilot, model: grok-4.7, reasoning: max, permissions: skip}
  - {role: Apprentice, brief: apprentice.md, colour: yellow, tool: copilot, model: gemini-3.8-flash, reasoning: high, context: long_context, permissions: skip}
